# GitHub Actions CI for netprobe-mcp.
#
# Three independent jobs run in parallel:
#   - lint    : go vet + gofmt (fail-fast on style regressions)
#   - build   : go build ./... on Linux and macOS
#   - test    : go test -race -count=1 ./...
#   - fuzz    : bounded fuzz of the two name normalizers (30s each)
#
# A failing job fails the workflow. The matrix is intentionally
# minimal: Go 1.25 (the version pinned in go.mod). Wider Go
# matrices can be added when the project decides to support older
# toolchains.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "gofmt found unformatted files:"
            echo "$output"
            exit 1
          fi

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: true
      - name: build
        run: go build ./...

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: true
      - name: go test
        run: go test -race -count=1 ./...

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: true
      - name: fuzz NormalizeHost
        run: |
          go test -run '^$' -fuzz=^FuzzNormalizeHost$ -fuzztime=30s ./internal/security/
      # Run separately: -fuzz takes a single target. The query-name
      # normalizer is the looser of the two — it admits a character the
      # host one does not — so it gets the same budget, not less.
      - name: fuzz NormalizeQueryName
        run: |
          go test -run '^$' -fuzz=^FuzzNormalizeQueryName$ -fuzztime=30s ./internal/security/

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: true
      - name: coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -n 1