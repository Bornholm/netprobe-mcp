# Release workflow for netprobe-mcp.
#
# Triggers on tag push (v*) and on PRs against main. On PRs the
# release is run in --snapshot mode so we validate the goreleaser
# pipeline without publishing artefacts.
#
# Tags are matched by `v*` to match the `release.name_template` in
# .goreleaser.yaml.

name: release

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  # write is needed so goreleaser can create the GitHub release and
  # upload artefacts (archives, nfpm packages, checksums.txt). The
  # GITHUB_TOKEN is scoped per-workflow, so blast radius stays low.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      flags: ""
    steps:
      # Only snapshot builds happen on PRs and manual dispatches.
      # Tag pushes run a real release.
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "flags=--snapshot" >> $GITHUB_ENV
      - uses: actions/checkout@v7
        with:
          # Full history is required so goreleaser can build the
          # changelog (it groups commits since the previous tag).
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          # Match the toolchain pinned in go.mod. `.x` lets Go
          # download the latest 1.25.x patch release on the runner.
          go-version: "1.25.x"
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean ${{ env.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}